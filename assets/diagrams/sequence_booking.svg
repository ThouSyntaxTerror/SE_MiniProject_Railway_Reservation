<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#20384a"/></marker>
    <style>.box{fill:#fff;stroke:#20384a;stroke-width:2}.life{stroke:#52606d;stroke-width:2;stroke-dasharray:8,7}.msg{stroke:#20384a;stroke-width:2;marker-end:url(#a)}.ret{stroke:#52606d;stroke-width:2;stroke-dasharray:7,5;marker-end:url(#a)}.title{font:700 25px Arial;fill:#143a5a}.label{font:17px Arial;fill:#17212b}.small{font:15px Arial;fill:#52606d}.alt{fill:#eef6f8;fill-opacity:.55;stroke:#1f6f8b;stroke-width:1.5}</style>
  </defs>
  <text x="650" y="38" text-anchor="middle" class="title">UML Sequence Diagram — Book Ticket</text>
  <g><rect x="35" y="70" width="160" height="55" class="box"/><text x="115" y="104" text-anchor="middle" class="label">Passenger</text><line x1="115" y1="125" x2="115" y2="800" class="life"/></g>
  <g><rect x="245" y="70" width="160" height="55" class="box"/><text x="325" y="104" text-anchor="middle" class="label">Web UI</text><line x1="325" y1="125" x2="325" y2="800" class="life"/></g>
  <g><rect x="455" y="70" width="160" height="55" class="box"/><text x="535" y="104" text-anchor="middle" class="label">REST API</text><line x1="535" y1="125" x2="535" y2="800" class="life"/></g>
  <g><rect x="665" y="70" width="170" height="55" class="box"/><text x="750" y="104" text-anchor="middle" class="label">Booking Service</text><line x1="750" y1="125" x2="750" y2="800" class="life"/></g>
  <g><rect x="885" y="70" width="170" height="55" class="box"/><text x="970" y="104" text-anchor="middle" class="label">Payment Simulator</text><line x1="970" y1="125" x2="970" y2="800" class="life"/></g>
  <g><rect x="1105" y="70" width="160" height="55" class="box"/><text x="1185" y="104" text-anchor="middle" class="label">Database</text><line x1="1185" y1="125" x2="1185" y2="800" class="life"/></g>
  <line x1="115" y1="175" x2="325" y2="175" class="msg"/><text x="220" y="162" text-anchor="middle" class="small">Select trip and book</text>
  <line x1="325" y1="225" x2="535" y2="225" class="msg"/><text x="430" y="212" text-anchor="middle" class="small">POST /api/bookings + idempotency key</text>
  <line x1="535" y1="275" x2="750" y2="275" class="msg"/><text x="642" y="262" text-anchor="middle" class="small">book(user, trip, key)</text>
  <line x1="750" y1="325" x2="1185" y2="325" class="msg"/><text x="968" y="312" text-anchor="middle" class="small">Begin transaction; lock available seat; create hold</text>
  <line x1="750" y1="375" x2="970" y2="375" class="msg"/><text x="860" y="362" text-anchor="middle" class="small">authorize(transactionRef)</text>
  <line x1="970" y1="425" x2="750" y2="425" class="ret"/><text x="860" y="412" text-anchor="middle" class="small">success / failure</text>
  <rect x="635" y="455" width="590" height="190" class="alt"/><text x="648" y="478" class="small">alt payment success / failure</text>
  <line x1="750" y1="515" x2="1185" y2="515" class="msg"/><text x="968" y="502" text-anchor="middle" class="small">[success] confirm booking + unique PNR; commit</text>
  <line x1="750" y1="575" x2="1185" y2="575" class="msg"/><text x="968" y="562" text-anchor="middle" class="small">[failure] release hold; record failure; rollback/commit state</text>
  <line x1="750" y1="680" x2="535" y2="680" class="ret"/><text x="642" y="667" text-anchor="middle" class="small">booking result</text>
  <line x1="535" y1="730" x2="325" y2="730" class="ret"/><text x="430" y="717" text-anchor="middle" class="small">201 + PNR or failure response</text>
  <line x1="325" y1="780" x2="115" y2="780" class="ret"/><text x="220" y="767" text-anchor="middle" class="small">Show confirmation or actionable error</text>
</svg>


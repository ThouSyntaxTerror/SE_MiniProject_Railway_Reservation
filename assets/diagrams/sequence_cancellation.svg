<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#20384a"/></marker>
    <style>.box{fill:#fff;stroke:#20384a;stroke-width:2}.life{stroke:#52606d;stroke-width:2;stroke-dasharray:8,7}.msg{stroke:#20384a;stroke-width:2;marker-end:url(#a)}.ret{stroke:#52606d;stroke-width:2;stroke-dasharray:7,5;marker-end:url(#a)}.title{font:700 25px Arial;fill:#143a5a}.label{font:17px Arial;fill:#17212b}.small{font:15px Arial;fill:#52606d}.note{fill:#fff7e6;stroke:#a56b12;stroke-width:1.3}</style>
  </defs>
  <text x="650" y="38" text-anchor="middle" class="title">UML Sequence Diagram — Cancel Booking</text>
  <g><rect x="35" y="70" width="160" height="55" class="box"/><text x="115" y="104" text-anchor="middle" class="label">Passenger</text><line x1="115" y1="125" x2="115" y2="755" class="life"/></g>
  <g><rect x="245" y="70" width="160" height="55" class="box"/><text x="325" y="104" text-anchor="middle" class="label">Web UI</text><line x1="325" y1="125" x2="325" y2="755" class="life"/></g>
  <g><rect x="455" y="70" width="160" height="55" class="box"/><text x="535" y="104" text-anchor="middle" class="label">REST API</text><line x1="535" y1="125" x2="535" y2="755" class="life"/></g>
  <g><rect x="665" y="70" width="170" height="55" class="box"/><text x="750" y="104" text-anchor="middle" class="label">Booking Service</text><line x1="750" y1="125" x2="750" y2="755" class="life"/></g>
  <g><rect x="885" y="70" width="170" height="55" class="box"/><text x="970" y="104" text-anchor="middle" class="label">Payment Simulator</text><line x1="970" y1="125" x2="970" y2="755" class="life"/></g>
  <g><rect x="1105" y="70" width="160" height="55" class="box"/><text x="1185" y="104" text-anchor="middle" class="label">Database</text><line x1="1185" y1="125" x2="1185" y2="755" class="life"/></g>
  <line x1="115" y1="175" x2="325" y2="175" class="msg"/><text x="220" y="162" text-anchor="middle" class="small">Choose confirmed PNR</text>
  <line x1="325" y1="225" x2="535" y2="225" class="msg"/><text x="430" y="212" text-anchor="middle" class="small">POST /api/bookings/{id}/cancel</text>
  <line x1="535" y1="275" x2="750" y2="275" class="msg"/><text x="642" y="262" text-anchor="middle" class="small">cancel(user, booking)</text>
  <line x1="750" y1="325" x2="1185" y2="325" class="msg"/><text x="968" y="312" text-anchor="middle" class="small">Lock booking; validate owner, confirmed state and departure time</text>
  <line x1="750" y1="385" x2="1185" y2="385" class="msg"/><text x="968" y="372" text-anchor="middle" class="small">Mark cancelled; release seat once; append audit event</text>
  <line x1="750" y1="445" x2="970" y2="445" class="msg"/><text x="860" y="432" text-anchor="middle" class="small">refund(paymentRef)</text>
  <line x1="970" y1="495" x2="750" y2="495" class="ret"/><text x="860" y="482" text-anchor="middle" class="small">refund reference / failure</text>
  <line x1="750" y1="545" x2="1185" y2="545" class="msg"/><text x="968" y="532" text-anchor="middle" class="small">Store refund outcome; commit</text>
  <rect x="820" y="575" width="390" height="58" rx="4" class="note"/><text x="1015" y="600" text-anchor="middle" class="small">Late, repeated or non-owner requests do not</text><text x="1015" y="621" text-anchor="middle" class="small">release inventory a second time.</text>
  <line x1="750" y1="660" x2="535" y2="660" class="ret"/><text x="642" y="647" text-anchor="middle" class="small">cancellation + refund status</text>
  <line x1="535" y1="705" x2="325" y2="705" class="ret"/><text x="430" y="692" text-anchor="middle" class="small">200, 403/404 or 409</text>
  <line x1="325" y1="745" x2="115" y2="745" class="ret"/><text x="220" y="732" text-anchor="middle" class="small">Show result</text>
</svg>

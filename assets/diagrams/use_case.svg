<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .shape{fill:#fff;stroke:#20384a;stroke-width:2}.line{fill:none;stroke:#20384a;stroke-width:2}
      .title{font:700 26px Arial,sans-serif;fill:#143a5a}.label{font:18px Arial,sans-serif;fill:#17212b}
      .small{font:16px Arial,sans-serif;fill:#52606d}.boundary{fill:#f8fbfc;stroke:#1f6f8b;stroke-width:3}
    </style>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="title">Railway Reservation System — UML Use-Case Diagram</text>
  <rect x="215" y="72" width="765" height="670" rx="8" class="boundary"/>
  <text x="235" y="102" class="small">Railway Reservation System boundary</text>

  <circle cx="92" cy="330" r="28" class="shape"/><line x1="92" y1="358" x2="92" y2="448" class="line"/>
  <line x1="42" y1="390" x2="142" y2="390" class="line"/><line x1="92" y1="448" x2="48" y2="510" class="line"/>
  <line x1="92" y1="448" x2="136" y2="510" class="line"/><text x="92" y="542" text-anchor="middle" class="label">Passenger</text>

  <circle cx="1092" cy="330" r="28" class="shape"/><line x1="1092" y1="358" x2="1092" y2="448" class="line"/>
  <line x1="1042" y1="390" x2="1142" y2="390" class="line"/><line x1="1092" y1="448" x2="1048" y2="510" class="line"/>
  <line x1="1092" y1="448" x2="1136" y2="510" class="line"/><text x="1092" y="542" text-anchor="middle" class="label">Administrator</text>

  <ellipse cx="455" cy="160" rx="145" ry="42" class="shape"/><text x="455" y="167" text-anchor="middle" class="label">Register account</text>
  <ellipse cx="455" cy="250" rx="145" ry="42" class="shape"/><text x="455" y="257" text-anchor="middle" class="label">Sign in</text>
  <ellipse cx="455" cy="340" rx="145" ry="42" class="shape"/><text x="455" y="347" text-anchor="middle" class="label">Search trains</text>
  <ellipse cx="455" cy="430" rx="145" ry="42" class="shape"/><text x="455" y="437" text-anchor="middle" class="label">Check availability</text>
  <ellipse cx="455" cy="520" rx="145" ry="42" class="shape"/><text x="455" y="527" text-anchor="middle" class="label">Book ticket</text>
  <ellipse cx="455" cy="610" rx="145" ry="42" class="shape"/><text x="455" y="617" text-anchor="middle" class="label">View / cancel booking</text>

  <ellipse cx="790" cy="250" rx="145" ry="42" class="shape"/><text x="790" y="257" text-anchor="middle" class="label">Manage train inventory</text>
  <ellipse cx="790" cy="430" rx="145" ry="42" class="shape"/><text x="790" y="437" text-anchor="middle" class="label">Review audit events</text>

  <line x1="142" y1="390" x2="318" y2="178" class="line"/><line x1="142" y1="390" x2="313" y2="268" class="line"/>
  <line x1="142" y1="390" x2="310" y2="340" class="line"/><line x1="142" y1="390" x2="310" y2="430" class="line"/>
  <line x1="142" y1="390" x2="315" y2="505" class="line"/><line x1="142" y1="390" x2="323" y2="588" class="line"/>
  <line x1="1042" y1="390" x2="930" y2="270" class="line"/><line x1="1042" y1="390" x2="934" y2="430" class="line"/>

  <ellipse cx="790" cy="610" rx="145" ry="42" class="shape"/><text x="790" y="617" text-anchor="middle" class="label">Simulate payment</text>
  <line x1="595" y1="535" x2="654" y2="580" class="line" stroke-dasharray="7,6"/><polygon points="654,580 640,577 647,567" fill="#20384a"/>
  <text x="632" y="563" class="small">«include»</text>
</svg>
